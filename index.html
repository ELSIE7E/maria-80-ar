<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Maria 80 AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    body {
      margin: 0;
      overflow: hidden;
    }

    #message {
      position: fixed;

      top: 20px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 9999;

      width: 80%;
      max-width: 350px;

      padding: 12px 20px;

      background: rgba(0, 0, 0, 0.75);
      color: white;

      border-radius: 20px;

      font-family: Arial, sans-serif;
      font-size: 16px;

      text-align: center;
    }

  </style>


  <script>

    /*
    ===========================================
    CUSTOM ROUNDED VIDEO COMPONENT
    ===========================================

    This creates the video surface ourselves
    instead of using the normal <a-video>.

    That allows us to:
      1. Round the corners.
      2. Crop the video instead of stretching it.
    */

    AFRAME.registerComponent(
      "rounded-video",
      {

        schema: {

          src: {
            type: "selector"
          },

          width: {
            type: "number",
            default: 0.47
          },

          height: {
            type: "number",
            default: 0.32
          },

          radius: {
            type: "number",
            default: 0.10
          }

        },


        init: function () {

          const video = this.data.src;

          const width = this.data.width;
          const height = this.data.height;
          const radius = this.data.radius;


          /*
          Create video texture
          */

          const texture =
            new THREE.VideoTexture(video);

          texture.minFilter =
            THREE.LinearFilter;

          texture.magFilter =
            THREE.LinearFilter;

          texture.colorSpace =
            THREE.SRGBColorSpace;


          /*
          Rectangle geometry
          */

          const geometry =
            new THREE.PlaneGeometry(
              width,
              height
            );


          /*
          Custom material

          The shader handles:
          - rounded corners
          - cropping
          */

          const material =
            new THREE.ShaderMaterial({

              transparent: true,

              uniforms: {

                map: {
                  value: texture
                },

                radius: {
                  value: radius
                },

                aspect: {
                  value: width / height
                }

              },


              vertexShader: `

                varying vec2 vUv;

                void main() {

                  vUv = uv;

                  gl_Position =
                    projectionMatrix *
                    modelViewMatrix *
                    vec4(position, 1.0);

                }

              `,


              fragmentShader: `

                uniform sampler2D map;

                uniform float radius;
                uniform float aspect;

                varying vec2 vUv;


                void main() {

                  /*
                  ---------------------------
                  VIDEO CROPPING
                  ---------------------------

                  Original video = 16:9.

                  We crop the left/right edges
                  instead of stretching people.
                  */

                  float videoAspect =
                    16.0 / 9.0;

                  vec2 videoUV =
                    vUv;

                  float crop =
                    aspect / videoAspect;

                  videoUV.x =
                    0.5 +
                    (vUv.x - 0.5) *
                    crop;


                  /*
                  ---------------------------
                  ROUNDED CORNERS
                  ---------------------------
                  */

                  vec2 p =
                    abs(vUv - 0.5);

                  vec2 box =
                    vec2(
                      0.5 - radius,
                      0.5 - radius
                    );

                  vec2 q =
                    p - box;

                  float distanceToCorner =
                    length(max(q, 0.0));


                  if (
                    distanceToCorner >
                    radius
                  ) {

                    discard;

                  }


                  /*
                  Display video
                  */

                  gl_FragColor =
                    texture2D(
                      map,
                      videoUV
                    );

                }

              `

            });


          /*
          Put our custom video
          into the A-Frame entity
          */

          const mesh =
            new THREE.Mesh(
              geometry,
              material
            );

          this.el.setObject3D(
            "mesh",
            mesh
          );

        }

      }
    );

  </script>

</head>


<body>


  <div id="message">
    Point your camera at Maria's TV
  </div>


  <a-scene

    mindar-image="
      imageTargetSrc: ./targets.mind;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

  >


    <!-- VIDEO FILE -->

    <a-assets>

      <video
        id="ar-video"

        src="./Larga_Vida_WebAR_final.mp4"

        preload="auto"

        playsinline
        webkit-playsinline

        crossorigin="anonymous"

        loop
      >
      </video>

    </a-assets>


    <!-- CAMERA -->

    <a-camera

      position="0 0 0"

      look-controls="enabled: false"

    >
    </a-camera>


    <!-- MARIA ARTWORK TARGET -->

    <a-entity

      id="target"

      mindar-image-target="
        targetIndex: 0
      "

    >


      <!--
      ROUNDED CRT VIDEO SCREEN
      -->

      <a-entity

        rounded-video="
          src: #ar-video;
          width: 0.415;
          height: 0.280;
          radius: 0.105;
        "
        
        position="
          -0.045
          -0.025
          0.01
        "

      >
      </a-entity>


    </a-entity>


  </a-scene>


  <script>

    const target =
      document.querySelector("#target");

    const video =
      document.querySelector("#ar-video");

    const message =
      document.querySelector("#message");


    /*
    TARGET FOUND
    */

    target.addEventListener(
      "targetFound",
      async () => {

        message.innerHTML =
          "TV detected! Playing video...";


        try {

          await video.play();

        }

        catch (error) {

          console.log(
            "Autoplay blocked:",
            error
          );

          message.innerHTML =
            "TV detected — tap the screen to play.";

        }

      }
    );


    /*
    TARGET LOST
    */

    target.addEventListener(
      "targetLost",
      () => {

        video.pause();

        message.innerHTML =
          "Point your camera back at Maria's TV.";

      }
    );


    /*
    MOBILE AUTOPLAY FALLBACK
    */

    document.body.addEventListener(
      "click",
      async () => {

        if (video.paused) {

          try {

            await video.play();

          }

          catch (error) {

            console.log(error);

          }

        }

      }
    );

  </script>


</body>

</html>
