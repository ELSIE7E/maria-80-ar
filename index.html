<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Maria 80 AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* =====================================================
       WELCOME SCREEN
       This sits ON TOP of MindAR.
       MindAR is still allowed to initialize underneath it.
       ===================================================== */

    #welcome {
      position: fixed;
      inset: 0;
      z-index: 10000;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px;
      box-sizing: border-box;

      background: #fff8e6;
    }

    #welcome-card {
      width: 100%;
      max-width: 420px;
      text-align: center;
      color: #12348a;
    }

    #welcome-card h1 {
      margin: 0 0 14px 0;
      font-size: 34px;
      line-height: 1.05;
    }

    #welcome-card .subtitle {
      margin: 0 0 28px 0;
      font-size: 19px;
      line-height: 1.4;
      color: #333;
    }

    #welcome-card .instructions {
      margin: 0 auto 30px auto;
      max-width: 330px;

      font-size: 16px;
      line-height: 1.5;

      color: #555;
    }

    #start-button {
      border: none;
      border-radius: 999px;

      padding: 16px 30px;

      min-width: 220px;

      background: #12348a;
      color: white;

      font-size: 18px;
      font-weight: bold;

      cursor: pointer;
    }

    #start-button:disabled {
      opacity: 0.6;
    }

    /* =====================================================
       AR STATUS MESSAGE
       ===================================================== */

    #message {
      position: fixed;

      top: max(20px, env(safe-area-inset-top));
      left: 50%;

      transform: translateX(-50%);

      z-index: 9999;

      width: 80%;
      max-width: 350px;

      padding: 12px 20px;

      box-sizing: border-box;

      background: rgba(0, 0, 0, 0.75);
      color: white;

      border-radius: 20px;

      font-size: 16px;
      text-align: center;

      display: none;
    }
  </style>


  <script>
    /*
    =========================================================
    CUSTOM ROUNDED VIDEO COMPONENT

    IMPORTANT:
    These are the dimensions from our working calibrated
    version. We are preserving them.
    =========================================================
    */

    AFRAME.registerComponent(
      "rounded-video",
      {
        schema: {
          src: {
            type: "selector"
          },

          width: {
            type: "number",
            default: 0.47
          },

          height: {
            type: "number",
            default: 0.32
          },

          radius: {
            type: "number",
            default: 0.10
          }
        },


        init: function () {
          const video = this.data.src;

          const width = this.data.width;
          const height = this.data.height;
          const radius = this.data.radius;


          /*
          Create video texture
          */

          const texture =
            new THREE.VideoTexture(video);

          texture.minFilter =
            THREE.LinearFilter;

          texture.magFilter =
            THREE.LinearFilter;

          texture.colorSpace =
            THREE.SRGBColorSpace;


          /*
          Rectangle geometry
          */

          const geometry =
            new THREE.PlaneGeometry(
              width,
              height
            );


          /*
          Custom material
          */

          const material =
            new THREE.ShaderMaterial({

              transparent: true,

              uniforms: {
                map: {
                  value: texture
                },

                radius: {
                  value: radius
                },

                aspect: {
                  value: width / height
                }
              },


              vertexShader: `
                varying vec2 vUv;

                void main() {
                  vUv = uv;

                  gl_Position =
                    projectionMatrix *
                    modelViewMatrix *
                    vec4(position, 1.0);
                }
              `,


              fragmentShader: `
                uniform sampler2D map;

                uniform float radius;
                uniform float aspect;

                varying vec2 vUv;


                void main() {

                  /*
                  VIDEO CROPPING

                  Original video = 16:9.
                  Crop horizontally rather than stretch.
                  */

                  float videoAspect =
                    16.0 / 9.0;

                  vec2 videoUV =
                    vUv;

                  float crop =
                    aspect / videoAspect;

                  videoUV.x =
                    0.5 +
                    (vUv.x - 0.5) *
                    crop;


                  /*
                  ROUNDED CORNERS
                  */

                  vec2 p =
                    abs(vUv - 0.5);

                  vec2 box =
                    vec2(
                      0.5 - radius,
                      0.5 - radius
                    );

                  vec2 q =
                    p - box;

                  float distanceToCorner =
                    length(max(q, 0.0));


                  if (
                    distanceToCorner >
                    radius
                  ) {
                    discard;
                  }


                  gl_FragColor =
                    texture2D(
                      map,
                      videoUV
                    );
                }
              `
            });


          const mesh =
            new THREE.Mesh(
              geometry,
              material
            );

          this.el.setObject3D(
            "mesh",
            mesh
          );
        }
      }
    );
  </script>

</head>


<body>

  <!-- =====================================================
       WELCOME SCREEN
       ===================================================== -->

  <div id="welcome">

    <div id="welcome-card">

      <h1>
        María Huerta
      </h1>

      <p class="subtitle">
        80 años de historias
      </p>

      <p class="instructions">
        Tap below to begin, allow camera access,
        and then point your phone at María's TV.
      </p>

      <button id="start-button">
        Start Experience
      </button>

    </div>

  </div>


  <!-- AR STATUS -->

  <div id="message">
    Point your camera at Maria's TV
  </div>


  <!-- =====================================================
       MINDAR SCENE

       IMPORTANT:
       autoStart is FALSE.

       This lets MindAR load normally but waits for the
       user's Start Experience tap before activating AR.
       ===================================================== -->

  <a-scene

    id="ar-scene"

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

    embedded

  >


    <!-- VIDEO FILE -->

    <a-assets>

      <video
        id="ar-video"

        src="./Larga_Vida_WebAR_final.mp4"

        preload="auto"

        playsinline
        webkit-playsinline

        crossorigin="anonymous"

        loop
        muted
      >
      </video>

    </a-assets>


    <!-- CAMERA -->

    <a-camera

      position="0 0 0"

      look-controls="enabled: false"

    >
    </a-camera>


    <!-- MARIA ARTWORK TARGET -->

    <a-entity

      id="target"

      mindar-image-target="
        targetIndex: 0
      "

    >


      <!-- =================================================
           ROUNDED CRT VIDEO

           DO NOT CHANGE THESE VALUES YET.

           This is our calibrated working size.
           ================================================= -->

      <a-entity

        rounded-video="
          src: #ar-video;
          width: 0.365;
          height: 0.240;
          radius: 0.105;
        "

        position="
          -0.045
          -0.025
          0.01
        "

      >
      </a-entity>


    </a-entity>


  </a-scene>


  <script>

    const scene =
      document.querySelector("#ar-scene");

    const target =
      document.querySelector("#target");

    const video =
      document.querySelector("#ar-video");

    const message =
      document.querySelector("#message");

    const welcome =
      document.querySelector("#welcome");

    const startButton =
      document.querySelector("#start-button");


    let experienceStarted = false;


    /*
    =========================================================
    START EXPERIENCE

    The user's ONE intentional tap does three things:

    1. Unlocks video playback on iPhone.
    2. Starts MindAR.
    3. Removes the welcome screen.

    =========================================================
    */

    startButton.addEventListener(
      "click",
      async () => {

        if (experienceStarted) {
          return;
        }

        experienceStarted = true;

        startButton.disabled = true;
        startButton.textContent = "Starting...";


        /*
        -----------------------------------------------------
        IMPORTANT iPHONE STEP

        We briefly start the MUTED video during the user's
        tap. This gives Safari permission to play it later
        when the AR target is detected.

        Then we immediately pause and rewind it.
        -----------------------------------------------------
        */

        try {

          video.muted = true;

          await video.play();

          video.pause();

          video.currentTime = 0;

        }

        catch (error) {

          console.log(
            "Video unlock warning:",
            error
          );

        }


        /*
        -----------------------------------------------------
        START MINDAR
        -----------------------------------------------------
        */

        try {

          const mindarSystem =
            scene.systems["mindar-image-system"];


          if (!mindarSystem) {

            throw new Error(
              "MindAR system is not ready."
            );

          }


          await mindarSystem.start();


          /*
          AR successfully started.
          Now remove welcome screen.
          */

          welcome.style.display =
            "none";

          message.style.display =
            "block";

          message.innerHTML =
            "Point your camera at Maria's TV";

        }

        catch (error) {

          console.error(
            "MindAR start error:",
            error
          );


          /*
          Allow another attempt if camera permission
          or initialization failed.
          */

          experienceStarted = false;

          startButton.disabled = false;

          startButton.textContent =
            "Try Again";

        }

      }
    );


    /*
    =========================================================
    TARGET FOUND
    =========================================================
    */

    target.addEventListener(
      "targetFound",
      async () => {

        message.innerHTML =
          "TV detected! Playing video...";


        try {

          /*
          Keep it muted so Safari can play it automatically
          after the initial Start Experience interaction.
          */

          video.muted = true;

          await video.play();

        }

        catch (error) {

          console.log(
            "Playback error:",
            error
          );

          message.innerHTML =
            "TV detected — tap once to play.";

        }

      }
    );


    /*
    =========================================================
    TARGET LOST
    =========================================================
    */

    target.addEventListener(
      "targetLost",
      () => {

        video.pause();

        message.innerHTML =
          "Point your camera back at Maria's TV.";

      }
    );


    /*
    =========================================================
    EMERGENCY PLAYBACK FALLBACK

    Normally this should NOT be necessary.

    It is here only in case a particular Safari version
    still blocks playback.
    =========================================================
    */

    document.body.addEventListener(
      "click",
      async () => {

        if (
          experienceStarted &&
          video.paused &&
          welcome.style.display === "none"
        ) {

          try {

            video.muted = true;

            await video.play();

          }

          catch (error) {

            console.log(
              "Fallback playback error:",
              error
            );

          }

        }

      }
    );

  </script>


</body>

</html>
