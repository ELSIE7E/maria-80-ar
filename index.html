<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Maria 80 AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }


    /* ==============================
       WELCOME SCREEN
       ============================== */

    #welcome {
      position: fixed;
      inset: 0;

      z-index: 10000;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px;
      box-sizing: border-box;

      background: #fff8e6;
    }


    #welcome-card {
      width: 100%;
      max-width: 420px;

      text-align: center;

      color: #12348a;
    }


    #welcome-card h1 {
      margin: 0 0 14px 0;

      font-size: 34px;
      line-height: 1.05;
    }


    #welcome-card .subtitle {
      margin: 0 0 28px 0;

      font-size: 19px;
      line-height: 1.4;

      color: #333;
    }


    #welcome-card .instructions {
      margin: 0 auto 30px auto;

      max-width: 330px;

      font-size: 16px;
      line-height: 1.5;

      color: #555;
    }


    #start-button {
      border: none;
      border-radius: 999px;

      padding: 16px 30px;

      min-width: 220px;

      background: #12348a;
      color: white;

      font-size: 18px;
      font-weight: bold;

      cursor: pointer;
    }


    #start-button:disabled {
      opacity: 0.55;
      cursor: default;
    }


    /* ==============================
       AR MESSAGE
       ============================== */

    #message {
      position: fixed;

      top: max(20px, env(safe-area-inset-top));
      left: 50%;

      transform: translateX(-50%);

      z-index: 9999;

      width: 80%;
      max-width: 350px;

      padding: 12px 20px;

      box-sizing: border-box;

      background: rgba(0, 0, 0, 0.75);
      color: white;

      border-radius: 20px;

      font-size: 16px;
      text-align: center;

      display: none;
    }

  </style>


  <script>

    /*
    ===========================================
    CUSTOM ROUNDED VIDEO COMPONENT
    ===========================================
    */

    AFRAME.registerComponent(
      "rounded-video",
      {

        schema: {

          src: {
            type: "selector"
          },

          width: {
            type: "number",
            default: 0.47
          },

          height: {
            type: "number",
            default: 0.32
          },

          radius: {
            type: "number",
            default: 0.10
          }

        },


        init: function () {

          const video = this.data.src;

          const width = this.data.width;
          const height = this.data.height;
          const radius = this.data.radius;


          /*
          VIDEO TEXTURE
          */

          const texture =
            new THREE.VideoTexture(video);

          texture.minFilter =
            THREE.LinearFilter;

          texture.magFilter =
            THREE.LinearFilter;

          texture.colorSpace =
            THREE.SRGBColorSpace;


          /*
          VIDEO PLANE
          */

          const geometry =
            new THREE.PlaneGeometry(
              width,
              height
            );


          /*
          CUSTOM VIDEO MATERIAL
          */

          const material =
            new THREE.ShaderMaterial({

              transparent: true,

              uniforms: {

                map: {
                  value: texture
                },

                radius: {
                  value: radius
                },

                aspect: {
                  value: width / height
                }

              },


              vertexShader: `

                varying vec2 vUv;

                void main() {

                  vUv = uv;

                  gl_Position =
                    projectionMatrix *
                    modelViewMatrix *
                    vec4(position, 1.0);

                }

              `,


              fragmentShader: `

                uniform sampler2D map;

                uniform float radius;
                uniform float aspect;

                varying vec2 vUv;


                void main() {

                  /*
                  VIDEO CROPPING
                  */

                  float videoAspect =
                    16.0 / 9.0;

                  vec2 videoUV =
                    vUv;

                  float crop =
                    aspect / videoAspect;

                  videoUV.x =
                    0.5 +
                    (vUv.x - 0.5) *
                    crop;


                  /*
                  ROUNDED CORNERS
                  */

                  vec2 p =
                    abs(vUv - 0.5);

                  vec2 box =
                    vec2(
                      0.5 - radius,
                      0.5 - radius
                    );

                  vec2 q =
                    p - box;

                  float distanceToCorner =
                    length(max(q, 0.0));


                  if (
                    distanceToCorner >
                    radius
                  ) {

                    discard;

                  }


                  /*
                  DISPLAY VIDEO
                  */

                  gl_FragColor =
                    texture2D(
                      map,
                      videoUV
                    );

                }

              `

            });


          const mesh =
            new THREE.Mesh(
              geometry,
              material
            );


          this.el.setObject3D(
            "mesh",
            mesh
          );

        }

      }
    );



    /*
    ===========================================
    STABILIZED AR ANCHOR
    ===========================================

    MindAR still does all target detection.

    Instead of putting the video directly inside
    the MindAR target, this component follows the
    target gradually.

    This reduces tiny frame-to-frame movements
    that can make the video appear to shake.

    IMPORTANT:
    This does NOT change the calibrated video
    size or its position inside the television.
    ===========================================
    */

    AFRAME.registerComponent(
      "stable-anchor",
      {

        schema: {

          target: {
            type: "selector"
          },

          /*
          Larger values = follows faster.
          Smaller values = smoother but more lag.

          These values are intentionally moderate.
          */

          positionSpeed: {
            type: "number",
            default: 12
          },

          rotationSpeed: {
            type: "number",
            default: 10
          },

          scaleSpeed: {
            type: "number",
            default: 12
          }

        },


        init: function () {

          this.target =
            this.data.target;


          this.tracking =
            false;


          this.initialized =
            false;


          /*
          Hide stabilized content until
          MindAR actually finds the target.
          */

          this.el.object3D.visible =
            false;


          /*
          TARGET FOUND
          */

          this.target.addEventListener(
            "targetFound",
            () => {

              this.tracking =
                true;


              /*
              On first detection, SNAP directly
              to the target.

              This prevents the video from
              flying in from another position.
              */

              this.copyTargetImmediately();


              this.initialized =
                true;


              this.el.object3D.visible =
                true;

            }
          );


          /*
          TARGET LOST
          */

          this.target.addEventListener(
            "targetLost",
            () => {

              this.tracking =
                false;

              this.initialized =
                false;

              this.el.object3D.visible =
                false;

            }
          );

        },



        copyTargetImmediately: function () {

          if (!this.target) {
            return;
          }


          const source =
            this.target.object3D;

          const destination =
            this.el.object3D;


          destination.position.copy(
            source.position
          );


          destination.quaternion.copy(
            source.quaternion
          );


          destination.scale.copy(
            source.scale
          );

        },



        tick: function (time, delta) {

          if (
            !this.tracking ||
            !this.initialized ||
            !this.target
          ) {

            return;

          }


          const source =
            this.target.object3D;

          const destination =
            this.el.object3D;


          /*
          Convert frame time to seconds.
          */

          const dt =
            Math.min(
              delta / 1000,
              0.1
            );


          /*
          Exponential smoothing.

          This behaves consistently even if
          the phone's frame rate changes.
          */

          const positionAlpha =
            1 -
            Math.exp(
              -this.data.positionSpeed * dt
            );


          const rotationAlpha =
            1 -
            Math.exp(
              -this.data.rotationSpeed * dt
            );


          const scaleAlpha =
            1 -
            Math.exp(
              -this.data.scaleSpeed * dt
            );


          /*
          SMOOTH POSITION
          */

          destination.position.lerp(
            source.position,
            positionAlpha
          );


          /*
          SMOOTH ROTATION
          */

          destination.quaternion.slerp(
            source.quaternion,
            rotationAlpha
          );


          /*
          SMOOTH SCALE
          */

          destination.scale.lerp(
            source.scale,
            scaleAlpha
          );

        }

      }
    );

  </script>

</head>


<body>


  <!-- ==============================
       WELCOME SCREEN
       ============================== -->

  <div id="welcome">

    <div id="welcome-card">

      <h1>
        María Huerta
      </h1>

      <p class="subtitle">
        80 años de historias
      </p>

      <p class="instructions">
        Tap below to begin, allow camera access,
        and then point your phone at María's TV.
      </p>

      <button
        id="start-button"
        disabled
      >
        Loading...
      </button>

    </div>

  </div>


  <!-- ==============================
       AR MESSAGE
       ============================== -->

  <div id="message">
    Point your camera at Maria's TV
  </div>



  <!-- ==============================
       AR SCENE
       ============================== -->

  <a-scene

    id="ar-scene"

    mindar-image="
        imageTargetSrc: ./targets.mind;
        autoStart: false;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

    embedded

  >


    <!-- VIDEO -->

    <a-assets>

      <video
        id="ar-video"

        src="./Larga_Vida_WebAR_final.mp4"

        preload="auto"

        playsinline
        webkit-playsinline

        crossorigin="anonymous"

        loop
      >
      </video>

    </a-assets>



    <!-- CAMERA -->

    <a-camera

      position="0 0 0"

      look-controls="enabled: false"

    >
    </a-camera>



    <!--
    ==========================================
    MINDAR IMAGE TARGET

    MindAR tracks this entity.

    The video is intentionally NOT placed
    directly inside this target anymore.
    ==========================================
    -->

    <a-entity

      id="target"

      mindar-image-target="
        targetIndex: 0
      "

    >
    </a-entity>



    <!--
    ==========================================
    STABILIZED VIDEO ANCHOR

    This follows #target smoothly instead of
    copying every tiny tracking movement.
    ==========================================
    -->

    <a-entity

      id="stable-target"

      stable-anchor="
        target: #target;
        positionSpeed: 12;
        rotationSpeed: 10;
        scaleSpeed: 12;
      "

    >


      <!--
      ==========================================
      CALIBRATED TV VIDEO

      THESE VALUES ARE UNCHANGED.
      ==========================================
      -->

      <a-entity

        rounded-video="
          src: #ar-video;
          width: 0.365;
          height: 0.240;
          radius: 0.105;
        "

        position="
          -0.045
          -0.025
          0.01
        "

      >
      </a-entity>


    </a-entity>


  </a-scene>



  <script>

    const scene =
      document.querySelector("#ar-scene");

    const target =
      document.querySelector("#target");

    const video =
      document.querySelector("#ar-video");

    const message =
      document.querySelector("#message");

    const welcome =
      document.querySelector("#welcome");

    const startButton =
      document.querySelector("#start-button");


    let sceneReady = false;

    let experienceStarted = false;

    let targetVisible = false;



    /*
    ==========================================
    WAIT UNTIL A-FRAME IS REALLY READY
    ==========================================
    */

    function enableStartButton() {

      if (sceneReady) {
        return;
      }


      const mindarSystem =
        scene.systems["mindar-image-system"];


      if (!mindarSystem) {

        setTimeout(
          enableStartButton,
          150
        );

        return;

      }


      sceneReady = true;

      startButton.disabled = false;

      startButton.textContent =
        "Start Experience";

    }



    if (scene.hasLoaded) {

      enableStartButton();

    }

    else {

      scene.addEventListener(
        "loaded",
        enableStartButton
      );

    }



    /*
    ==========================================
    START EXPERIENCE
    ==========================================

    This remains the ONE intentional user tap.

    It unlocks:
    1. Video playback
    2. Audio
    3. MindAR
    4. Camera permission
    ==========================================
    */

    startButton.addEventListener(
      "click",
      async () => {

        if (
          !sceneReady ||
          experienceStarted
        ) {

          return;

        }


        experienceStarted = true;

        startButton.disabled = true;

        startButton.textContent =
          "Starting...";


        /*
        ======================================
        UNLOCK VIDEO + AUDIO
        ======================================
        */

        try {

          video.muted = true;

          video.volume = 1.0;


          await video.play();


          video.muted = false;


          video.pause();

          video.currentTime = 0;


          console.log(
            "Video/audio unlocked."
          );

        }

        catch (error) {

          console.log(
            "Video unlock warning:",
            error
          );

        }



        /*
        ======================================
        START MINDAR
        ======================================
        */

        try {

          const mindarSystem =
            scene.systems[
              "mindar-image-system"
            ];


          await mindarSystem.start();


          welcome.style.display =
            "none";

          message.style.display =
            "block";

          message.innerHTML =
            "Point your camera at Maria's TV";

        }

        catch (error) {

          console.error(
            "MindAR start error:",
            error
          );


          experienceStarted = false;

          startButton.disabled = false;

          startButton.textContent =
            "Try Again";

        }

      }
    );



    /*
    ==========================================
    TARGET FOUND
    ==========================================
    */

    target.addEventListener(
      "targetFound",
      async () => {

        targetVisible = true;


        message.innerHTML =
          "TV detected! Playing video...";


        try {

          video.muted = false;

          video.volume = 1.0;


          await video.play();


          setTimeout(
            () => {

              if (targetVisible) {

                message.style.display =
                  "none";

              }

            },
            1500
          );

        }

        catch (error) {

          console.log(
            "Playback error:",
            error
          );


          message.style.display =
            "block";

          message.innerHTML =
            "TV detected — tap once for sound.";

        }

      }
    );



    /*
    ==========================================
    TARGET LOST
    ==========================================
    */

    target.addEventListener(
      "targetLost",
      () => {

        targetVisible = false;


        video.pause();


        message.style.display =
          "block";

        message.innerHTML =
          "Point your camera back at Maria's TV.";

      }
    );



    /*
    ==========================================
    SAFARI AUDIO FALLBACK
    ==========================================
    */

    document.body.addEventListener(
      "click",
      async () => {

        if (
          !experienceStarted ||
          !targetVisible
        ) {

          return;

        }


        if (
          video.paused ||
          video.muted
        ) {

          try {

            video.muted = false;

            video.volume = 1.0;

            await video.play();


            message.style.display =
              "none";

          }

          catch (error) {

            console.log(
              "Safari audio fallback:",
              error
            );

          }

        }

      }
    );

  </script>


</body>

</html>
