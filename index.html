<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Maria 80 AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    body {
      margin: 0;
      overflow: hidden;
    }

    #message {
      position: fixed;
      top: 20px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 9999;

      width: 80%;
      max-width: 350px;

      padding: 12px 20px;

      background: rgba(0, 0, 0, 0.75);
      color: white;

      border-radius: 20px;

      font-family: Arial, sans-serif;
      font-size: 16px;

      text-align: center;
    }

  </style>

</head>


<body>

  <div id="message">
    Point your camera at Maria's TV
  </div>


  <a-scene

    mindar-image="
      imageTargetSrc: ./targets.mind;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

  >


    <!--
      VIDEO FILE

      playsinline is especially important
      for mobile browsers.
    -->

    <a-assets>

      <video
        id="ar-video"

        src="./Larga_Vida_WebAR_final.mp4"

        preload="auto"

        playsinline
        webkit-playsinline

        crossorigin="anonymous"

        loop
      >
      </video>

    </a-assets>


    <!-- CAMERA -->

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    >
    </a-camera>


    <!-- IMAGE TARGET -->

    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0"
    >


      <!-- VIDEO DISPLAY -->

      <a-video

        src="#ar-video"
      
        position="-0.025 -0.035 0.01"
      
        width="0.47"
      
        height="0.32"
      
      >
      </a-video>


    </a-entity>


  </a-scene>


  <script>

    const target =
      document.querySelector("#target");

    const video =
      document.querySelector("#ar-video");

    const message =
      document.querySelector("#message");


    /* TARGET FOUND */

    target.addEventListener(
      "targetFound",
      async () => {

        message.innerHTML =
          "TV detected! Playing video...";

        try {

          await video.play();

        } catch (error) {

          console.log(
            "Video autoplay was blocked:",
            error
          );

          message.innerHTML =
            "TV detected — tap the screen to play.";

        }

      }
    );


    /* TARGET LOST */

    target.addEventListener(
      "targetLost",
      () => {

        video.pause();

        message.innerHTML =
          "Point your camera back at Maria's TV.";

      }
    );


    /* FALLBACK FOR MOBILE AUTOPLAY */

    document.body.addEventListener(
      "click",
      async () => {

        if (video.paused) {

          try {
            await video.play();
          } catch (error) {
            console.log(error);
          }

        }

      }
    );

  </script>


</body>

</html>
