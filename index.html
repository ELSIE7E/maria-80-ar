
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>María Huerta — 80 Años de Historias</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #welcome {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      box-sizing: border-box;
      background: #fff8e6;
    }

    #welcome-card {
      width: 100%;
      max-width: 420px;
      text-align: center;
      color: #12348a;
    }

    #welcome-card h1 {
      margin: 0 0 14px;
      font-size: 34px;
    }

    .subtitle {
      margin: 0 0 28px;
      font-size: 19px;
      color: #333;
    }

    .instructions {
      margin: 0 auto 30px;
      max-width: 330px;
      font-size: 16px;
      line-height: 1.5;
      color: #555;
    }

    #start-button {
      border: none;
      border-radius: 999px;
      padding: 16px 30px;
      min-width: 220px;
      background: #12348a;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #start-button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    #message {
      position: fixed;
      top: max(20px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      width: 80%;
      max-width: 350px;
      padding: 12px 20px;
      box-sizing: border-box;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      border-radius: 20px;
      font-size: 16px;
      text-align: center;
      display: none;
    }
  </style>

  <script>
    /*
      EXACT TV SCREEN VIDEO MASK

      The SVG was generated from the full
      2048 x 2048 artwork.

      The new MindAR target was cropped to
      1970 x 1970, removing approximately
      39 pixels of bleed from each edge.

      The SVG mask is scaled to compensate.

      Video is cropped to fill the curved
      television screen without stretching.
    */

    AFRAME.registerComponent("tv-screen-video", {
      schema: {
        src: { type: "selector" },
        mask: {
          type: "string",
          default: "./Maria_Huerta_AR_contorno_pantalla.svg"
        }
      },

      init: function () {
        const video = this.data.src;

        // SVG screen bounds in its 1254 x 1254 space.
        const minX = 141 / 1254;
        const maxX = 984 / 1254;

        // Convert image top-origin Y to UV bottom-origin Y.
        const minY = 1 - 1040 / 1254;
        const maxY = 1 - 397 / 1254;

        const screenWidth = maxX - minX;
        const screenHeight = maxY - minY;

        // Full artwork is 2048 px.
        // Trimmed tracking image is 1970 px.
        const targetScale = 2048 / 1970;

        const videoTexture = new THREE.VideoTexture(video);

        videoTexture.minFilter = THREE.LinearFilter;
        videoTexture.magFilter = THREE.LinearFilter;
        videoTexture.colorSpace = THREE.SRGBColorSpace;

        const maskTexture = new THREE.TextureLoader().load(
          this.data.mask,
          () => {
            console.log("TV screen mask loaded.");
          },
          undefined,
          (error) => {
            console.error("Unable to load SVG mask:", error);
          }
        );

        maskTexture.minFilter = THREE.LinearFilter;
        maskTexture.magFilter = THREE.LinearFilter;

        const geometry = new THREE.PlaneGeometry(
          targetScale,
          targetScale
        );

        const material = new THREE.ShaderMaterial({
          transparent: true,
          depthWrite: false,
          side: THREE.DoubleSide,

          uniforms: {
            videoMap: { value: videoTexture },
            maskMap: { value: maskTexture },

            screenBounds: {
              value: new THREE.Vector4(
                minX, minY, screenWidth, screenHeight
              )
            },

            videoAspect: {
              value: 16.0 / 9.0
            }
          },

          vertexShader: `
            varying vec2 vUv;

            void main() {
              vUv = uv;

              gl_Position =
                projectionMatrix *
                modelViewMatrix *
                vec4(position, 1.0);
            }
          `,

          fragmentShader: `
            uniform sampler2D videoMap;
            uniform sampler2D maskMap;
            uniform vec4 screenBounds;
            uniform float videoAspect;

            varying vec2 vUv;

            void main() {
              vec4 maskColor = texture2D(maskMap, vUv);

              if (maskColor.a < 0.01) {
                discard;
              }

              // Coordinates within the TV screen.
              vec2 screenUV =
                (vUv - screenBounds.xy) /
                screenBounds.zw;

              // Crop the video to fill the screen.
              // Never stretch the video.
              float screenAspect =
                screenBounds.z / screenBounds.w;

              float ratio =
                screenAspect / videoAspect;

              vec2 videoUV = screenUV;

              if (ratio < 1.0) {
                videoUV.x =
                  0.5 + (screenUV.x - 0.5) * ratio;
              } else {
                videoUV.y =
                  0.5 + (screenUV.y - 0.5) / ratio;
              }

              vec4 color =
                texture2D(videoMap, videoUV);

              gl_FragColor =
                vec4(color.rgb, maskColor.a);
            }
          `
        });

        const mesh = new THREE.Mesh(geometry, material);

        // Keep the video slightly above the target.
        mesh.position.z = 0.01;

        mesh.frustumCulled = false;

        this.el.setObject3D("mesh", mesh);

        this.videoTexture = videoTexture;
        this.maskTexture = maskTexture;
        this.geometry = geometry;
        this.material = material;
      },

      remove: function () {
        this.el.removeObject3D("mesh");

        if (this.videoTexture) this.videoTexture.dispose();
        if (this.maskTexture) this.maskTexture.dispose();
        if (this.geometry) this.geometry.dispose();
        if (this.material) this.material.dispose();
      }
    });
  </script>
</head>

<body>

  <!-- WELCOME SCREEN -->

  <div id="welcome">
    <div id="welcome-card">
      <h1>María Huerta</h1>

      <p class="subtitle">
        80 años de historias
      </p>

      <p class="instructions">
        Tap below to begin, allow camera access,
        and then point your phone at María's TV.
      </p>

      <button id="start-button" disabled>
        Loading...
      </button>
    </div>
  </div>

  <!-- AR MESSAGE -->

  <div id="message">
    Point your camera at María's TV
  </div>

  <!-- AR SCENE -->

  <a-scene
    id="ar-scene"

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
    "

    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
  >

    <a-assets>
      <video
        id="ar-video"
        src="./Larga_Vida_WebAR_final.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
        loop
      ></video>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

    <!-- NEW IMAGE TARGET -->

    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0"
    >

      <!-- PRECISE CURVED TV SCREEN -->

      <a-entity
        id="tv-video"
        tv-screen-video="
          src: #ar-video;
          mask: ./Maria_Huerta_AR_contorno_pantalla.svg;
        "
      ></a-entity>

    </a-entity>

  </a-scene>

  <script>
    const scene = document.querySelector("#ar-scene");
    const target = document.querySelector("#target");
    const video = document.querySelector("#ar-video");

    const message = document.querySelector("#message");
    const welcome = document.querySelector("#welcome");
    const startButton = document.querySelector("#start-button");

    let sceneReady = false;
    let experienceStarted = false;
    let targetVisible = false;

    /*
      WAIT FOR A-FRAME AND MINDAR
    */

    function enableStartButton() {
      if (sceneReady) return;

      const mindarSystem =
        scene.systems["mindar-image-system"];

      if (!mindarSystem) {
        setTimeout(enableStartButton, 150);
        return;
      }

      sceneReady = true;

      startButton.disabled = false;
      startButton.textContent = "Start Experience";
    }

    if (scene.hasLoaded) {
      enableStartButton();
    } else {
      scene.addEventListener(
        "loaded",
        enableStartButton
      );
    }

    /*
      START EXPERIENCE
      PRESERVE SAFARI AUDIO UNLOCK
    */

    startButton.addEventListener("click", async () => {
      if (!sceneReady || experienceStarted) return;

      experienceStarted = true;

      startButton.disabled = true;
      startButton.textContent = "Starting...";

      try {
        video.muted = true;
        video.volume = 1.0;

        await video.play();

        video.muted = false;

        video.pause();
        video.currentTime = 0;

        console.log("Video/audio unlocked.");
      } catch (error) {
        console.log("Video unlock warning:", error);
      }

      try {
        const mindarSystem =
          scene.systems["mindar-image-system"];

        await mindarSystem.start();

        welcome.style.display = "none";

        message.style.display = "block";
        message.textContent =
          "Point your camera at María's TV";

      } catch (error) {
        console.error("MindAR start error:", error);

        experienceStarted = false;

        startButton.disabled = false;
        startButton.textContent = "Try Again";
      }
    });

    /*
      TARGET FOUND
    */

    target.addEventListener("targetFound", async () => {
      targetVisible = true;

      message.style.display = "block";
      message.textContent =
        "TV detected! Playing video...";

      try {
        video.muted = false;
        video.volume = 1.0;

        await video.play();

        setTimeout(() => {
          if (targetVisible) {
            message.style.display = "none";
          }
        }, 1500);

      } catch (error) {
        console.log("Playback error:", error);

        message.style.display = "block";
        message.textContent =
          "TV detected — tap once for sound.";
      }
    });

    /*
      TARGET LOST
    */

    target.addEventListener("targetLost", () => {
      targetVisible = false;

      video.pause();

      message.style.display = "block";
      message.textContent =
        "Point your camera back at María's TV.";
    });

    /*
      SAFARI AUDIO FALLBACK
    */

    document.body.addEventListener("click", async () => {
      if (!experienceStarted || !targetVisible) {
        return;
      }

      if (video.paused || video.muted) {
        try {
          video.muted = false;
          video.volume = 1.0;

          await video.play();

          message.style.display = "none";

        } catch (error) {
          console.log("Safari audio fallback:", error);
        }
      }
    });

  </script>

</body>
</html>
