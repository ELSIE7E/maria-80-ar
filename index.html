<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Maria 80 AR Test</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    body {
      margin: 0;
      overflow: hidden;
    }

    #message {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);

      z-index: 9999;

      background: rgba(0, 0, 0, 0.75);
      color: white;

      padding: 12px 20px;
      border-radius: 20px;

      font-family: Arial, sans-serif;
      font-size: 16px;

      text-align: center;

      width: 80%;
      max-width: 350px;
    }

  </style>

</head>


<body>

  <!-- Instructions shown over the camera -->

  <div id="message">
    Point your camera at Maria's TV
  </div>


  <!-- AR SCENE -->

  <a-scene

    mindar-image="
      imageTargetSrc: ./targets.mind;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

  >


    <!-- CAMERA -->

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    >
    </a-camera>


    <!-- OUR IMAGE TARGET -->

    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0"
    >


      <!--
        TEST RECTANGLE

        If MindAR recognizes your artwork,
        this red rectangle will appear.
      -->

      <a-plane

        color="#FF0000"

        position="0 0 0"

        height="0.35"

        width="0.55"

        opacity="0.85"

      >
      </a-plane>


    </a-entity>


  </a-scene>


  <script>

    const target =
      document.querySelector("#target");

    const message =
      document.querySelector("#message");


    target.addEventListener(
      "targetFound",
      () => {

        message.innerHTML =
          "TV detected! AR is working.";

      }
    );


    target.addEventListener(
      "targetLost",
      () => {

        message.innerHTML =
          "Target lost — point back at Maria's TV.";

      }
    );

  </script>


</body>

</html>
