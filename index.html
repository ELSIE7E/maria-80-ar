<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Maria Huerta — 80 Years of Stories</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #f7f0df;
    }


    /* =========================
       WELCOME SCREEN
       ========================= */

    #welcome-screen {
      position: fixed;
      inset: 0;

      z-index: 10000;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px;

      background:
        radial-gradient(
          circle at center,
          #fffaf0 0%,
          #f7e8bf 100%
        );

      text-align: center;
    }


    #welcome-card {
      width: 100%;
      max-width: 420px;

      padding: 38px 26px;

      background: rgba(255, 255, 255, 0.88);

      border: 4px solid #12378b;
      border-radius: 30px;

      box-shadow:
        0 15px 45px rgba(0, 0, 0, 0.18);
    }


    #welcome-card h1 {
      margin: 0 0 5px;

      color: #12378b;

      font-size: 36px;
      line-height: 1.05;
    }


    #welcome-card h2 {
      margin: 0 0 25px;

      color: #e5a000;

      font-size: 22px;
    }


    #welcome-card p {
      margin: 0 auto 28px;

      max-width: 310px;

      color: #333;

      font-size: 17px;
      line-height: 1.5;
    }


    #start-button {
      width: 100%;

      padding: 17px 20px;

      border: none;
      border-radius: 50px;

      background: #12378b;
      color: white;

      font-size: 17px;
      font-weight: bold;

      cursor: pointer;
    }


    #start-button:active {
      transform: scale(0.98);
    }


    /* =========================
       AR INSTRUCTIONS
       ========================= */

    #message {
      display: none;

      position: fixed;

      top: calc(20px + env(safe-area-inset-top));
      left: 50%;

      transform: translateX(-50%);

      z-index: 9999;

      width: 84%;
      max-width: 380px;

      padding: 13px 20px;

      background: rgba(0, 0, 0, 0.78);
      color: white;

      border-radius: 25px;

      font-size: 16px;
      text-align: center;
    }

  </style>


  <script>

    /*
    ==========================================
    ROUNDED CRT VIDEO
    ==========================================
    */

    AFRAME.registerComponent(
      "rounded-video",
      {

        schema: {

          src: {
            type: "selector"
          },

          width: {
            type: "number",
            default: 0.365
          },

          height: {
            type: "number",
            default: 0.240
          },

          radius: {
            type: "number",
            default: 0.105
          }

        },


        init: function () {

          const video = this.data.src;

          const width = this.data.width;
          const height = this.data.height;
          const radius = this.data.radius;


          const texture =
            new THREE.VideoTexture(video);

          texture.minFilter =
            THREE.LinearFilter;

          texture.magFilter =
            THREE.LinearFilter;


          const geometry =
            new THREE.PlaneGeometry(
              width,
              height
            );


          const material =
            new THREE.ShaderMaterial({

              transparent: true,

              uniforms: {

                map: {
                  value: texture
                },

                radius: {
                  value: radius
                },

                aspect: {
                  value: width / height
                }

              },


              vertexShader: `

                varying vec2 vUv;

                void main() {

                  vUv = uv;

                  gl_Position =
                    projectionMatrix *
                    modelViewMatrix *
                    vec4(position, 1.0);

                }

              `,


              fragmentShader: `

                uniform sampler2D map;

                uniform float radius;
                uniform float aspect;

                varying vec2 vUv;


                void main() {

                  /*
                  Crop 16:9 video
                  without stretching it.
                  */

                  float videoAspect =
                    16.0 / 9.0;

                  vec2 videoUV =
                    vUv;

                  float crop =
                    aspect / videoAspect;

                  videoUV.x =
                    0.5 +
                    (vUv.x - 0.5) *
                    crop;


                  /*
                  Rounded CRT corners.
                  */

                  vec2 p =
                    abs(vUv - 0.5);

                  vec2 box =
                    vec2(
                      0.5 - radius,
                      0.5 - radius
                    );

                  vec2 q =
                    p - box;

                  float distanceToCorner =
                    length(max(q, 0.0));


                  if (
                    distanceToCorner >
                    radius
                  ) {

                    discard;

                  }


                  gl_FragColor =
                    texture2D(
                      map,
                      videoUV
                    );

                }

              `

            });


          const mesh =
            new THREE.Mesh(
              geometry,
              material
            );


          this.el.setObject3D(
            "mesh",
            mesh
          );

        }

      }
    );

  </script>

</head>


<body>


  <!-- =========================
       WELCOME SCREEN
       ========================= -->

  <div id="welcome-screen">

    <div id="welcome-card">

      <h1>María Huerta</h1>

      <h2>80 Years of Stories</h2>

      <p>
        Point your camera at the keepsake
        and discover a special story created
        to celebrate 80 years of memories.
      </p>

      <button id="start-button">
        START THE EXPERIENCE
      </button>

    </div>

  </div>



  <!-- AR MESSAGE -->

  <div id="message">
    Point your camera at María's TV
  </div>



  <!-- =========================
       AR SCENE
       ========================= -->

  <a-scene

    id="ar-scene"

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

  >


    <!-- VIDEO -->

    <a-assets>

      <video
        id="ar-video"

        src="./Larga_Vida_WebAR_final.mp4"

        preload="auto"

        playsinline
        webkit-playsinline

        crossorigin="anonymous"
      >
      </video>

    </a-assets>



    <!-- CAMERA -->

    <a-camera

      position="0 0 0"

      look-controls="enabled: false"

    >
    </a-camera>



    <!-- TARGET -->

    <a-entity

      id="target"

      mindar-image-target="
        targetIndex: 0
      "

    >


      <a-entity

        rounded-video="
          src: #ar-video;
          width: 0.365;
          height: 0.240;
          radius: 0.105;
        "

        position="
          -0.045
          -0.025
          0.01
        "

      >
      </a-entity>


    </a-entity>


  </a-scene>



  <script>

    const welcomeScreen =
      document.querySelector(
        "#welcome-screen"
      );

    const startButton =
      document.querySelector(
        "#start-button"
      );

    const scene =
      document.querySelector(
        "#ar-scene"
      );

    const target =
      document.querySelector(
        "#target"
      );

    const video =
      document.querySelector(
        "#ar-video"
      );

    const message =
      document.querySelector(
        "#message"
      );


    let experienceStarted = false;



    /*
    ==========================================
    START EXPERIENCE
    ==========================================
    */

    startButton.addEventListener(
      "click",
      async () => {

        if (experienceStarted) {
          return;
        }

        experienceStarted = true;

        startButton.disabled = true;

        startButton.innerHTML =
          "OPENING CAMERA...";


        /*
        This silent play/pause occurs during
        the user's tap.

        It helps establish the media interaction
        on mobile browsers.
        */

        video.muted = true;

        try {

          await video.play();

          video.pause();

          video.currentTime = 0;

        }

        catch (error) {

          console.log(
            "Media initialization:",
            error
          );

        }


        /*
        Start MindAR manually.
        */

        try {

          const arSystem =
            scene.systems[
              "mindar-image-system"
            ];

          await arSystem.start();


          /*
          Camera successfully started.
          */

          welcomeScreen.style.display =
            "none";

          message.style.display =
            "block";

          message.innerHTML =
            "Point your camera at María's TV";


          /*
          We can restore audio after
          initializing media.
          */

          video.muted = false;

        }

        catch (error) {

          console.error(
            "Camera could not start:",
            error
          );

          experienceStarted = false;

          startButton.disabled = false;

          startButton.innerHTML =
            "TRY AGAIN";

        }

      }
    );



    /*
    ==========================================
    TARGET FOUND
    ==========================================
    */

    target.addEventListener(
      "targetFound",
      async () => {

        message.innerHTML =
          "TV detected!";


        /*
        Start from beginning the first time.
        */

        try {

          await video.play();

        }

        catch (error) {

          console.log(
            "Playback blocked:",
            error
          );

          message.innerHTML =
            "TV detected — tap once to play.";

        }

      }
    );



    /*
    ==========================================
    TARGET LOST
    ==========================================
    */

    target.addEventListener(
      "targetLost",
      () => {

        video.pause();

        message.innerHTML =
          "Point your camera back at María's TV";

      }
    );



    /*
    Fallback if Safari still requires
    another interaction.
    */

    document.body.addEventListener(
      "click",
      async () => {

        if (
          experienceStarted &&
          video.paused
        ) {

          try {

            await video.play();

          }

          catch (error) {

            console.log(error);

          }

        }

      }
    );

  </script>


</body>

</html>
