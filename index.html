<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>María Huerta — 80 Years of Stories</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #f7f0df;
    }

    /* =========================
       WELCOME SCREEN
       ========================= */

    #welcome-screen {
      position: fixed;
      inset: 0;
      z-index: 10000;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px;

      background:
        radial-gradient(
          circle at center,
          #fffaf0 0%,
          #f7e8bf 100%
        );

      text-align: center;
    }

    #welcome-card {
      width: 100%;
      max-width: 420px;

      padding: 38px 26px;

      background: rgba(255, 255, 255, 0.88);

      border: 4px solid #12378b;
      border-radius: 30px;

      box-shadow:
        0 15px 45px rgba(0, 0, 0, 0.18);
    }

    #welcome-card h1 {
      margin: 0 0 5px;

      color: #12378b;

      font-size: 36px;
      line-height: 1.05;
    }

    #welcome-card h2 {
      margin: 0 0 25px;

      color: #e5a000;

      font-size: 22px;
    }

    #welcome-card p {
      margin: 0 auto 28px;

      max-width: 310px;

      color: #333;

      font-size: 17px;
      line-height: 1.5;
    }

    #start-button {
      width: 100%;

      padding: 17px 20px;

      border: none;
      border-radius: 50px;

      background: #12378b;
      color: white;

      font-size: 17px;
      font-weight: bold;

      cursor: pointer;
    }

    #start-button:active {
      transform: scale(0.98);
    }

    /* =========================
       AR MESSAGE
       ========================= */

    #message {
      display: none;

      position: fixed;

      top: calc(20px + env(safe-area-inset-top));
      left: 50%;

      transform: translateX(-50%);

      z-index: 9999;

      width: 84%;
      max-width: 380px;

      padding: 13px 20px;

      background: rgba(0, 0, 0, 0.78);
      color: white;

      border-radius: 25px;

      font-size: 16px;
      text-align: center;
    }

  </style>


  <script>

    /* ==========================================
       CUSTOM ROUNDED VIDEO COMPONENT
       ========================================== */

    AFRAME.registerComponent(
      "rounded-video",
      {

        schema: {

          src: {
            type: "selector"
          },

          width: {
            type: "number",
            default: 0.365
          },

          height: {
            type: "number",
            default: 0.240
          },

          radius: {
            type: "number",
            default: 0.105
          }

        },


        init: function () {

          const video = this.data.src;

          const width = this.data.width;
          const height = this.data.height;
          const radius = this.data.radius;


          const texture =
            new THREE.VideoTexture(video);

          texture.minFilter =
            THREE.LinearFilter;

          texture.magFilter =
            THREE.LinearFilter;


          const geometry =
            new THREE.PlaneGeometry(
              width,
              height
            );


          const material =
            new THREE.ShaderMaterial({

              transparent: true,

              uniforms: {

                map: {
                  value: texture
                },

                radius: {
                  value: radius
                },

                aspect: {
                  value: width / height
                }

              },


              vertexShader: `

                varying vec2 vUv;

                void main() {

                  vUv = uv;

                  gl_Position =
                    projectionMatrix *
                    modelViewMatrix *
                    vec4(position, 1.0);

                }

              `,


              fragmentShader: `

                uniform sampler2D map;

                uniform float radius;
                uniform float aspect;

                varying vec2 vUv;


                void main() {

                  /* Crop the 16:9 video
                     without stretching it */

                  float videoAspect =
                    16.0 / 9.0;

                  vec2 videoUV =
                    vUv;

                  float crop =
                    aspect / videoAspect;

                  videoUV.x =
                    0.5 +
                    (vUv.x - 0.5) *
                    crop;


                  /* Rounded CRT corners */

                  vec2 p =
                    abs(vUv - 0.5);

                  vec2 box =
                    vec2(
                      0.5 - radius,
                      0.5 - radius
                    );

                  vec2 q =
                    p - box;

                  float distanceToCorner =
                    length(max(q, 0.0));


                  if (
                    distanceToCorner >
                    radius
                  ) {

                    discard;

                  }


                  gl_FragColor =
                    texture2D(
                      map,
                      videoUV
                    );

                }

              `

            });


          const mesh =
            new THREE.Mesh(
              geometry,
              material
            );


          this.el.setObject3D(
            "mesh",
            mesh
          );

        }

      }
    );

  </script>

</head>


<body>


  <!-- ==========================================
       WELCOME SCREEN
       ========================================== -->

  <div id="welcome-screen">

    <div id="welcome-card">

      <h1>María Huerta</h1>

      <h2>80 Years of Stories</h2>

      <p>
        Point your camera at the keepsake
        and discover a special story created
        to celebrate 80 years of memories.
      </p>

      <button id="start-button">
        START THE EXPERIENCE
      </button>

    </div>

  </div>



  <!-- ==========================================
       AR INSTRUCTION MESSAGE
       ========================================== -->

  <div id="message">
    Point your camera at María's TV
  </div>



  <!-- ==========================================
       AR SCENE
       ========================================== -->

  <a-scene

    id="ar-scene"

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

  >


    <!-- ==========================================
         VIDEO ASSET
         ========================================== -->

    <a-assets>

      <video
        id="ar-video"

        src="./Larga_Vida_WebAR_final.mp4"

        preload="auto"

        playsinline
        webkit-playsinline

        crossorigin="anonymous"
      >
      </video>

    </a-assets>



    <!-- ==========================================
         CAMERA
         ========================================== -->

    <a-camera

      position="0 0 0"

      look-controls="enabled: false"

    >
    </a-camera>



    <!-- ==========================================
         IMAGE TARGET
         ========================================== -->

    <a-entity

      id="target"

      mindar-image-target="
        targetIndex: 0
      "

    >


      <!--
        IMPORTANT:
        These are our calibrated TV-screen values.

        Width  = 0.365
        Height = 0.240
        X      = -0.045
        Y      = -0.025
        Radius = 0.105

        Don't change these for now.
      -->

      <a-entity

        id="video-plane"

        rounded-video="
          src: #ar-video;
          width: 0.365;
          height: 0.240;
          radius: 0.105;
        "

        position="
          -0.045
          -0.025
          0.01
        "

        visible="false"

      >
      </a-entity>


    </a-entity>


  </a-scene>



  <!-- ==========================================
       EXPERIENCE LOGIC
       ========================================== -->

  <script>

    const welcomeScreen =
      document.querySelector(
        "#welcome-screen"
      );


    const startButton =
      document.querySelector(
        "#start-button"
      );


    const scene =
      document.querySelector(
        "#ar-scene"
      );


    const target =
      document.querySelector(
        "#target"
      );


    const video =
      document.querySelector(
        "#ar-video"
      );


    const videoPlane =
      document.querySelector(
        "#video-plane"
      );


    const message =
      document.querySelector(
        "#message"
      );


    let experienceStarted = false;



    /* ==========================================
       START EXPERIENCE
       ========================================== */

    startButton.addEventListener(
      "click",
      async () => {

        if (experienceStarted) {
          return;
        }


        experienceStarted = true;


        startButton.disabled = true;

        startButton.innerHTML =
          "OPENING CAMERA...";


        try {

          const arSystem =
            scene.systems[
              "mindar-image-system"
            ];


          await arSystem.start();


          /*
          Camera is now running.
          Remove the welcome screen.
          */

          welcomeScreen.style.display =
            "none";


          /*
          Show instructions.
          */

          message.style.display =
            "block";

          message.innerHTML =
            "Point your camera at María's TV";


          /*
          The AR video remains hidden
          until MindAR actually recognizes
          the target.
          */

          videoPlane.setAttribute(
            "visible",
            "false"
          );

        }


        catch (error) {

          console.error(
            "Camera could not start:",
            error
          );


          experienceStarted = false;


          startButton.disabled = false;

          startButton.innerHTML =
            "TRY AGAIN";

        }

      }
    );



    /* ==========================================
       TARGET FOUND
       ========================================== */

    target.addEventListener(
      "targetFound",
      async () => {

        /*
        MindAR has recognized the TV artwork.
        Only NOW do we reveal the video.
        */

        videoPlane.setAttribute(
          "visible",
          "true"
        );


        message.innerHTML =
          "TV detected! Playing video...";


        try {

          await video.play();


          /*
          Once video successfully starts,
          remove the message after a moment.
          */

          setTimeout(
            () => {

              if (!video.paused) {

                message.style.display =
                  "none";

              }

            },
            1200
          );

        }


        catch (error) {

          console.log(
            "Playback blocked:",
            error
          );


          message.style.display =
            "block";

          message.innerHTML =
            "TV detected — tap the screen to play.";

        }

      }
    );



    /* ==========================================
       TARGET LOST
       ========================================== */

    target.addEventListener(
      "targetLost",
      () => {

        /*
        Pause the video when the user
        moves away from the TV.
        */

        video.pause();


        /*
        Hide the AR video completely.
        */

        videoPlane.setAttribute(
          "visible",
          "false"
        );


        /*
        Tell the guest what to do.
        */

        message.style.display =
          "block";

        message.innerHTML =
          "Point your camera back at María's TV";

      }
    );



    /* ==========================================
       SAFARI PLAYBACK FALLBACK
       ========================================== */

    document.body.addEventListener(
      "click",
      async () => {

        /*
        Only attempt this after the
        experience has started.
        */

        if (!experienceStarted) {
          return;
        }


        /*
        Only attempt playback if MindAR
        currently has the target visible.
        */

        const isVisible =
          videoPlane.getAttribute(
            "visible"
          );


        if (
          isVisible &&
          video.paused
        ) {

          try {

            await video.play();


            message.style.display =
              "none";

          }


          catch (error) {

            console.log(
              "Safari playback still blocked:",
              error
            );

          }

        }

      }
    );



    /* ==========================================
       VIDEO ENDED
       ========================================== */

    video.addEventListener(
      "ended",
      () => {

        /*
        For now we simply display a message.

        NEXT STEP:
        This is where we'll shut down AR
        and open the retro music player.
        */

        videoPlane.setAttribute(
          "visible",
          "false"
        );


        message.style.display =
          "block";

        message.innerHTML =
          "Story complete ❤️";

      }
    );

  </script>


</body>

</html>
